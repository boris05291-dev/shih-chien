<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>找不到頁面｜實踐大學高雄校區</title>
        <script>
            // 舊網址自動轉到新位置：
            // 1. 最早放在根目錄：/shih-chien/home.html
            // 2. 後來放在中文資料夾：/shih-chien/總作業/home.html（pathname 會是編碼過的 %E7%B8%BD...）
            const old =
                location.pathname.match(/^\/shih-chien\/([\w-]+\.html)$/) ||
                location.pathname.match(/^\/shih-chien\/(?:%E7%B8%BD%E4%BD%9C%E6%A5%AD|總作業)\/(.*)$/i);
            if (old) location.replace("/shih-chien/site/" + (old[1] || "home.html") + location.search + location.hash);
        </script>
        <link rel="icon" href="/shih-chien/site/p/01.png" />
        <link rel="stylesheet" href="/shih-chien/site/all.css?v=5" />
        <style>
            .not-found { min-height: 100svh; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; color: var(--text-main); }
            .not-found h1 { font-family: var(--font-display); font-size: clamp(5rem, 20vw, 10rem); line-height: 1; color: var(--accent-text); }
            .not-found a { text-decoration: underline; }
        </style>
    </head>
    <body>
        <main class="not-found">
            <h1>404</h1>
            <p>這一頁不在校史裡。<span lang="en">This page could not be found.</span></p>
            <p><a href="/shih-chien/site/home.html">回到首頁</a> ・ <a href="/shih-chien/site/home-en.html" lang="en">Back to home</a></p>
        </main>
    </body>
</html>
